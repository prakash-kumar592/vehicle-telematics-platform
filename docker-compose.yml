version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: vehicle_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - vehicle-network

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: vehicle_backend
    ports:
      - "5000:5000"
    environment:
      MONGODB_LOCAL: mongodb://admin:password@mongodb:27017/vehicle_fleet?authSource=admin
      PORT: 5000
    depends_on:
      - mongodb
    networks:
      - vehicle-network
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    image: nginx:alpine
    container_name: vehicle_frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    networks:
      - vehicle-network

volumes:
  mongodb_data:

networks:
  vehicle-network:
    driver: bridge
